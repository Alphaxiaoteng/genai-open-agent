[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-squad"
version = "2.0.0"
description = "Enterprise Multi-Agent Collaboration Platform with DAG Visualization and Human-in-the-Loop Gating (Open Agent Hackathon 2026)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Open Agent Hackathon 2026 Team" }]
keywords = ["multi-agent", "llm-agent", "self-reflection", "tool-use", "hackathon", "dag-visualization", "human-in-the-loop"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
]

[project.scripts]
squad = "squad.cli:main"
squad-web = "squad.web_server:run_server"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["squad", "squads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
